<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>信念發財樹 - 喝水養樹</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="header">
  <h1>信念發財樹</h1>
  <div class="subtitle">每一口水，都是對財富的信念灌溉</div>
</div>

<div class="stats-bar">
  <div class="stat-card">
    <div class="label">今日喝水</div>
    <div class="value" id="todayCups">0</div>
    <div class="unit">/ 8 杯</div>
  </div>
  <div class="stat-card">
    <div class="label">連續天數</div>
    <div class="value" id="streak">0</div>
    <div class="unit">天</div>
  </div>
  <div class="stat-card">
    <div class="label">樹的等級</div>
    <div class="value" id="treeLevel">1</div>
    <div class="unit" id="treeName">種子</div>
  </div>
  <div class="stat-card">
    <div class="label">累積金幣</div>
    <div class="value" id="totalCoins">0</div>
    <div class="unit">枚</div>
  </div>
</div>

<!-- Tab: 發財樹 -->
<div class="tab-content" data-tab="tree">
  <div class="progress-section">
    <div class="progress-bar-bg">
      <div class="progress-bar-fill" id="progressFill" style="width: 0%"></div>
    </div>
    <div class="progress-label">
      <span>今日進度</span>
      <span id="progressPct">0%</span>
    </div>
  </div>

  <div class="scene">
    <div class="stars" id="stars"></div>
    <div class="ground"></div>
    <div class="tree-container" id="treeContainer">
      <svg class="tree-svg" id="treeSvg" width="200" height="280" viewBox="0 0 200 280"></svg>
    </div>
  </div>

  <div class="fortune-msg" id="fortuneMsg"></div>

  <div class="action-section">
    <button class="drink-btn" id="drinkBtn" onclick="drinkWater()">
      💧 我喝了一杯水
    </button>
    <div class="cooldown-text" id="cooldownText"></div>
  </div>

  <div class="log-section">
    <div class="log-toggle" id="logToggle" onclick="toggleLog()">▼ 今日喝水記錄</div>
    <div class="log-list" id="logList"></div>
  </div>
</div>

<!-- Tab: 心情 -->
<div class="tab-content" data-tab="mood">
  <div class="mood-section">
    <div class="mood-title">
      ✍️ 心情筆記
      <span class="sub">隨手寫下此刻的想法，為發財樹注入靈氣</span>
    </div>
    <div class="mood-picker" id="moodPicker"></div>
    <textarea
      class="mood-textarea"
      id="moodInput"
      maxlength="500"
      placeholder="此刻在想什麼？一句話、一個念頭、一段抱怨、一份感恩……都可以寫下來。"
    ></textarea>
    <div class="mood-actions">
      <span class="mood-count" id="moodCount">0 / 500</span>
      <button class="mood-save-btn" id="moodSaveBtn" onclick="saveMood()">💾 儲存</button>
    </div>
    <div class="mood-toast" id="moodToast"></div>
    <div class="mood-history-toggle" id="moodHistoryToggle" onclick="toggleMoodHistory()">▼ 查看心情紀錄</div>
    <div class="mood-history" id="moodHistory"></div>
  </div>
</div>

<!-- Tab: 金爐 -->
<div class="tab-content" data-tab="burn">
  <div class="burn-section">
    <div class="burn-title">
      🔥 化煞金爐
      <span class="sub">寫下放不下的事，託付給火，化為灰燼隨風而去</span>
    </div>
    <textarea
      class="burn-textarea"
      id="burnText"
      maxlength="500"
      placeholder="讓你煩惱、遺憾、放不下的事……寫下來，按下焚化，不會留下任何紀錄。"
    ></textarea>
    <div class="burn-actions">
      <span class="burn-counter">已化解 <b id="burnCount">0</b> 則</span>
      <button class="burn-btn" id="burnBtn" onclick="burnPaper()">🔥 點火焚化</button>
    </div>
    <div class="burn-hint" id="burnHint"></div>
    <div class="burn-stage" id="burnStage" aria-hidden="true"></div>
  </div>
</div>

<!-- Tab: 更多 -->
<div class="tab-content" data-tab="more">
  <div class="demo-section">
    <button class="demo-toggle-btn" id="demoToggleBtn" onclick="toggleDemo()">🎬 模擬展示：預覽全部成長階段</button>
    <div class="demo-panel" id="demoPanel">
      <div class="demo-inner">
        <div class="demo-stage-label" id="demoStageLabel"></div>
        <div class="demo-stage-sub" id="demoStageSub"></div>
        <div class="demo-controls" id="demoControls"></div>
        <div class="demo-auto-bar">
          <button id="demoAutoBtn" onclick="toggleAutoDemo()">▶ 自動播放</button>
          <span class="speed-label">每階段 2 秒</span>
        </div>
      </div>
    </div>
  </div>

  <div class="reset-section">
    <button class="reset-btn" onclick="resetAll()">重置所有資料</button>
  </div>
</div>

<!-- Level up overlay -->
<div class="level-up-overlay" id="levelUpOverlay">
  <div class="level-up-card">
    <h2 id="levelUpTitle">🌳 升級了！</h2>
    <p id="levelUpDesc"></p>
    <button onclick="closeLevelUp()">太好了！</button>
  </div>
</div>

<!-- Bottom tab bar -->
<nav class="tab-bar" role="tablist">
  <button class="tab-btn" data-tab="tree" role="tab">
    <span class="tab-icon">🌳</span>
    <span class="tab-label">發財樹</span>
  </button>
  <button class="tab-btn" data-tab="mood" role="tab">
    <span class="tab-icon">✍️</span>
    <span class="tab-label">心情</span>
  </button>
  <button class="tab-btn" data-tab="burn" role="tab">
    <span class="tab-icon">🔥</span>
    <span class="tab-label">金爐</span>
  </button>
  <button class="tab-btn" data-tab="more" role="tab">
    <span class="tab-icon">⚙️</span>
    <span class="tab-label">更多</span>
  </button>
</nav>

<script src="app.js"></script>
</body>
</html>
